<!DOCTYPE html>
<html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
            <link rel="stylesheet" href="Order.css">
            <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
            <link href="https://fonts.google.com/specimen/Red+Hat+Display" rel="stylesheet" type="text/css">
            <title>Frontend Mentor | Order summary card</title>
          </head>
            <body>
              <header>
                <div class="card">
                    <div class="image-container">
                          <img src="../Day4project/images/illustration-hero.svg" alt="illustration">
                    </div>
                       <div class="content">
                              <h2>Order Summary</h2>
                              <p>
                              You can now listen to millions of songs, audiobooks, and podcasts on any 
                              device anywhere you like!</p>
                                  <div class="pricing">
                                        <img src="../Day4project/images/icon-music.svg" alt="" > 
                                      <div>
                                         <h4>Annual Plan</h4>
                                              <small>$59.99/year</small>
                                        </div>
                                        <a href="#">Change</a>
                                    </div>
                                     <button class="primary">Proceed to Payment</button>
                                     <button class="secondary">Cancel Order</button>
                            </div>
                        <footer class="attribution">
                          Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
                          Coded by <a href="#">Your Name Here</a>.
                        </footer>
                  </div>
               </header>
            </body>
</html>
