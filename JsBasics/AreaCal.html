<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="AreaCal.css">
    <title>Area Calculator</title>
</head>

<body>
    <form action="javascript:calculateArea()" onchange="javascript:updateForm()">
        <div class="main">
            <div class="welcm">
                <h1>Welcome to the Area Calculator</h1>
            </div>
            <div class="welcm-container">
                <p>This page calcultes the areas of different geometric shapes</p>

                <label for="id-shapes">
                    <h2>Choose a shape</h2>
                </label>
                <br>
                <select id="id-shapes">

                    <option value="none"></option>
                    <option value="rectangle">Rectangle</option>
                    <option value="triangle">Triangle</option>
                    <option value="circle">Circle</option>
                    <option value="ellipse">Ellipse</option>
                    <option value="square">Square</option>
                </select>
                <div id="rect-inputs" hidden>
                    <label for="id-length">Length</label>
                    <input id="id-length" type="number" min="0" step="any">

                    <label for="id-width">Width</label>
                    <input id="id-width" type="number" min="0" step="any">

                    <h2><em>Area = L*W </em></h2>


                </div>
                <div id="triangle-inputs" hidden>
                    <label for="base">Base</label>
                    <input id="base" type="number" min="0" step="any">

                    <label for="id-heigth">Height</label>
                    <input id="id-heigth" type="number" min="0" step="any">
                    <h2><em>Area = <sup>h*b</sup>&frasl;<sub>2</sub></em></h2>

                </div>
                <div id="circle-inputs" hidden>
                    <label for="radius">Radius</label>
                    <input id="radius" type="number" min="0" step="any">

                    <h2><em>Area =&Pi;r<sup>2</sup></em></h2>

                </div>
                <div id="ellipse-inputs" hidden>
                    <label for="minor-axis">a</label>
                    <input id="minor-axis" type="number" min="0" step="any">

                    <label for="major-axis">b</label>
                    <input id="major-axis" type="number" min="0" step="any">
                    <h2><em>Area =&Pi;a*b</em></h2>

                </div>
                <div id="square-inputs" hidden>
                    <label for="id-side">Side</label>
                    <input id="id-side" type="number" min="0" step="any">

                    <h2><em>Area = s<sup>2</sup></em></h2>

                </div>
                <br>
                <input type="submit" value="Calculate Area">
                <p id="output"></p>
            </div>

        </div>
    </form>
    <script src="AreaCal.js"></script>


</body>

</html>
