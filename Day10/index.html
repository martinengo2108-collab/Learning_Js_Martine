<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Phone AddressBook</title>

    <link rel="icon" type="image/png" sizes="32x32" href="./phonebook.png">
    <link rel="stylesheet" href="adressBook.css">
</head>

<body>
    <div class="container">
        <div class="title">

            <h1>📞 Address Book</h1>

        </div>

        <form id="contactForm">
            <div class="quickAddForm">

                <input type="text" id="fullName" placeholder="Full Name" required>

                <input type="tel" id="phoneNumber" placeholder="Phone Number" required>

                <input type="text" id="address" placeholder="Address" required>

                <input type="text" id="city" placeholder="City" required>

                <input type="text" id="email" placeholder="E-mail" required>

                <br><br>
            </div>
            <button type="submit" class="btn-add">Add Contact</button>

            <button type="button" class="btn-cancel">Cancel</button>

        </form>

        <div class="contact-list">
            <h2>Saved Contact</h2>

            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Phone Number</th>
                        <th>Address</th>
                        <th>City</th>
                        <th>E-mail</th>
                    </tr>
                </thead>
                <tfoot id="contactRows">

                </tfoot>
            </table>
        </div>


    </div>


    <script src="adressBook.js"></script>

</body>

</html>
