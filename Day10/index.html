<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Phone AddressBook</title>
    
    <link rel="icon" type="image/png" sizes="32x32" href="./phonebook.png">
    <link rel="stylesheet" href="adressBook.css">
</head>
<body>
    <div class="container">
        <div class="title">

            <h1>Address Book</h1>

        </div>
        <div class="quickadd">
            <button id="QuickAdd">+ Add</button>
        </div>
        <div class="quickAddForm">

            <label for="fullName">Name</label><input type="text" id="fullName" class="formFields">
            <label for="phone">Phone</label><input type="text" id="phone" class="formFields">

            <label for="address">Address</label><textarea  name="address" id="address" cols="30" rows="10" class="formFields"></textarea>

            <label for="city">City</label><input type="text" id="city" class="formFields">

            <label for="email">Email</label><input type="text" id="email" class="formFields">

            <br><br>
            <button id="Add">Add Now</button><button id="Cancel">Cancel</button>

        </div>

        
    </div>


    <script src="adressBook.js"></script>

</body>
</html>
