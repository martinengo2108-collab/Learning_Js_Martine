<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Phone AddressBook</title>

    <link rel="icon" type="image/png" sizes="32x32" href="./phonebook.png">
    <link rel="stylesheet" href="adressBook.css">
</head>

<body>
    <div class="container">
        <nav class="title">

            <h1>📞 Address Book</h1>

        </nav>



        <form id="contactForm">
            <div class="quickAddForm">
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" placeholder="Full Name" required>

                <label for="phoneNumber">Phone Number:</label>
                <input type="tel" id="phoneNumber" placeholder="Phone Number" required>

                <label for="address">Address:</label>
                <input type="text" id="address" placeholder="Address" required>

                <label for="city">City:</label>
                <input type="text" id="city" placeholder="City" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" placeholder="E-mail" required>

                
            </div>
            <button type="submit" class="btn-add">Add Contact</button>
            <button type="button" id="btn-cancel">Cancel</button>

        </form>

        <div class="contact-list">
            <h2>Save your Contacts</h2>

            <table class="table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Phone Number</th>
                        <th>Address</th>
                        <th>City</th>
                        <th>E-mail</th>

                    </tr>


                </thead>
                <tbody id="contactRows">

                </tbody>

            </table>

            <footer class="footer">
                <p>&copy; 2026 Address Book. All rights reserved.</p>
            </footer>
        </div>


    </div>


    <script src="adressBook.js"></script>

</body>

</html>
